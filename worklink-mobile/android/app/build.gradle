plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def homologationKeystorePath = System.getenv("WORKLINK_ANDROID_HOMOLOGATION_KEYSTORE_PATH")
def homologationKeystorePassword = System.getenv("WORKLINK_ANDROID_HOMOLOGATION_KEYSTORE_PASSWORD")
def homologationKeyAlias = System.getenv("WORKLINK_ANDROID_HOMOLOGATION_KEY_ALIAS")
def homologationKeyPassword = System.getenv("WORKLINK_ANDROID_HOMOLOGATION_KEY_PASSWORD")
def homologationSigningConfigured = [
    homologationKeystorePath,
    homologationKeystorePassword,
    homologationKeyAlias,
    homologationKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }
def resolveHomologationKeystoreFile = {
    def candidate = new File(homologationKeystorePath)
    candidate.isAbsolute() ? candidate : new File(rootProject.projectDir.parentFile, homologationKeystorePath)
}
def storeKeystorePath = System.getenv("WORKLINK_ANDROID_STORE_KEYSTORE_PATH")
def storeKeystorePassword = System.getenv("WORKLINK_ANDROID_STORE_KEYSTORE_PASSWORD")
def storeKeyAlias = System.getenv("WORKLINK_ANDROID_STORE_KEY_ALIAS")
def storeKeyPassword = System.getenv("WORKLINK_ANDROID_STORE_KEY_PASSWORD")
def storeSigningConfigured = [
    storeKeystorePath,
    storeKeystorePassword,
    storeKeyAlias,
    storeKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }
def resolveStoreKeystoreFile = {
    def candidate = new File(storeKeystorePath)
    candidate.isAbsolute() ? candidate : new File(rootProject.projectDir.parentFile, storeKeystorePath)
}

android {
    namespace = "br.com.worklink.mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    defaultConfig {
        applicationId = "br.com.worklink.mobile"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        homologation {
            if (homologationSigningConfigured) {
                storeFile = resolveHomologationKeystoreFile()
                storePassword = homologationKeystorePassword
                keyAlias = homologationKeyAlias
                keyPassword = homologationKeyPassword
            }
        }
        store {
            if (storeSigningConfigured) {
                storeFile = resolveStoreKeystoreFile()
                storePassword = storeKeystorePassword
                keyAlias = storeKeyAlias
                keyPassword = storeKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (storeSigningConfigured) {
                signingConfig = signingConfigs.store
            } else if (homologationSigningConfigured) {
                signingConfig = signingConfigs.homologation
            }
        }
    }
}

flutter {
    source = "../.."
}
