spring:
  application:
    name: worklink-api
  lifecycle:
    timeout-per-shutdown-phase: ${WORKLINK_SHUTDOWN_PHASE_TIMEOUT:30s}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    async:
      request-timeout: ${WORKLINK_ASYNC_REQUEST_TIMEOUT:5s}
  datasource:
    url: ${WORKLINK_DATABASE_URL}
    username: ${WORKLINK_DATABASE_USERNAME}
    password: ${WORKLINK_DATABASE_PASSWORD}
    hikari:
      connection-timeout: ${WORKLINK_DATABASE_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${WORKLINK_DATABASE_VALIDATION_TIMEOUT_MS:1000}
  data:
    redis:
      host: ${WORKLINK_REDIS_HOST}
      port: ${WORKLINK_REDIS_PORT}
      password: ${WORKLINK_REDIS_PASSWORD}

server:
  shutdown: graceful
  tomcat:
    connection-timeout: ${WORKLINK_SERVER_CONNECTION_TIMEOUT:5s}
  servlet:
    session:
      persistent: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: worklink-api

logging:
  pattern:
    console: "timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%5p service=worklink-api correlation_id=%X{correlationId:-none} logger=%logger{36} message=\"%replace(%m){'[\r\n]+',' '}\"%n"

worklink:
  storage:
    endpoint: ${WORKLINK_STORAGE_ENDPOINT}
    bucket: ${WORKLINK_STORAGE_BUCKET}
    access-key: ${WORKLINK_STORAGE_ACCESS_KEY}
    secret-key: ${WORKLINK_STORAGE_SECRET_KEY}
  security:
    jwt-secret: ${WORKLINK_JWT_SECRET}
    access-token-expiration-minutes: ${WORKLINK_ACCESS_TOKEN_EXPIRATION_MINUTES}
    refresh-token-expiration-days: ${WORKLINK_REFRESH_TOKEN_EXPIRATION_DAYS}
    otp-expiration-minutes: ${WORKLINK_OTP_EXPIRATION_MINUTES}
    professional-phone-verification-code: ${WORKLINK_PROFESSIONAL_PHONE_VERIFICATION_CODE}
    professional-phone-verification-expiration-minutes: ${WORKLINK_PROFESSIONAL_PHONE_VERIFICATION_EXPIRATION_MINUTES}
    encryption-key: ${WORKLINK_ENCRYPTION_KEY}
    otp-signing-secret: ${WORKLINK_OTP_SIGNING_SECRET}
    sensitive-value-pepper: ${WORKLINK_SENSITIVE_VALUE_PEPPER}
  integrations:
    sms-provider-api-key: ${WORKLINK_SMS_PROVIDER_API_KEY}
    external-http:
      connection-timeout: ${WORKLINK_EXTERNAL_HTTP_CONNECTION_TIMEOUT:2s}
      read-timeout: ${WORKLINK_EXTERNAL_HTTP_READ_TIMEOUT:5s}
      max-retry-attempts: ${WORKLINK_EXTERNAL_HTTP_MAX_RETRY_ATTEMPTS:2}
  cors:
    allowed-origins: ${WORKLINK_CORS_ALLOWED_ORIGINS}
  features:
    sms-enabled: ${WORKLINK_FEATURE_SMS_ENABLED}
    storage-enabled: ${WORKLINK_FEATURE_STORAGE_ENABLED}
