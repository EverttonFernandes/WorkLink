name: WorkLink CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: worklink-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare environment
        run: cp .env.example .env

      - name: Static analysis
        run: make backend-static-analysis

      - name: Unit tests and coverage
        run: make backend-unit-test

      - name: Integration tests
        run: make backend-integration-test

      - name: SonarCloud analysis
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "Skipping SonarCloud analysis because SONAR_TOKEN, SONAR_ORGANIZATION or SONAR_PROJECT_KEY is missing."
            exit 0
          fi
          docker compose --env-file .env run --rm backend-tests \
            mvn \
              org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.token="$SONAR_TOKEN" \
              -Dsonar.organization="$SONAR_ORGANIZATION" \
              -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.qualitygate.wait=true

      - name: Functional tests
        run: make functional-test

      - name: Cleanup
        if: always()
        run: make clean

  mobile:
    name: Mobile quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare environment
        run: cp .env.example .env

      - name: Static analysis
        run: make mobile-static-analysis

      - name: Mobile tests and coverage
        run: make mobile-test

      - name: Android build strategy
        run: make mobile-android-build

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: worklink-android-debug-${{ github.sha }}
          path: worklink-mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: make clean

  mobile-emulator:
    name: Mobile integration on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      WORKLINK_MOBILE_DIAGNOSTICS_DIR: artifacts/mobile-emulator-diagnostics

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Prepare environment
        run: cp .env.example .env

      - name: Prepare diagnostics directory
        run: |
          mkdir -p "$WORKLINK_MOBILE_DIAGNOSTICS_DIR"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Start backend dependencies
        run: |
          docker compose --env-file .env up -d postgres redis minio
          docker compose --env-file .env run --rm database-migrations
          docker compose --env-file .env up -d --build --wait worklink-api

      - name: Start Android emulator manually
        timeout-minutes: 20
        run: ./scripts/start_github_actions_android_emulator.sh

      - name: Run mobile integration tests on Android emulator
        run: |
          set -o pipefail
          cd worklink-mobile
          DEVICE_ID=emulator-5554 \
          CONTRACT_TEST_API_BASE_URL=http://localhost:8080 \
          DEVICE_API_BASE_URL=http://10.0.2.2:8080 \
          ./tool/run_mobile_emulator_integration_tests.sh 2>&1 | tee ../"$WORKLINK_MOBILE_DIAGNOSTICS_DIR/flutter-emulator-test.log"

      - name: Collect mobile emulator diagnostics
        if: always()
        run: ./scripts/collect_mobile_emulator_diagnostics.sh

      - name: Upload mobile emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-emulator-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mobile-emulator-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Android emulator
        if: always()
        run: ./scripts/stop_github_actions_android_emulator.sh

      - name: Cleanup
        if: always()
        run: make clean

  docker-image:
    name: API Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build multi-stage API image
        run: docker build -f docker/worklink-api.Dockerfile -t worklink-api:${{ github.sha }} .

      - name: Validate runtime image contract
        run: |
          docker image inspect worklink-api:${{ github.sha }} --format '{{json .Config.Healthcheck}}'
          docker run --rm --entrypoint sh worklink-api:${{ github.sha }} -lc \
            "test -f /app/worklink-api.jar && ! command -v mvn && ! command -v javac"

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mobile signing secrets guard
        run: ./scripts/check_no_mobile_signing_secrets.sh

      - name: Functional test dependencies audit
        run: |
          docker run --rm \
            -v "$PWD/functional-tests:/workspace/functional-tests" \
            -w /workspace/functional-tests \
            node:24-alpine npm audit --audit-level=moderate

      - name: Backend dependency resolution
        run: |
          cp .env.example .env
          docker compose --env-file .env run --rm backend-tests mvn -B dependency:tree

      - name: Cleanup
        if: always()
        run: make clean
