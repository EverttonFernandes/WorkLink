openapi: 3.0.3
info:
  title: WorkLink API
  version: 0.35.0
  description: API V1 do WorkLink para descoberta, contato, avaliações, denúncias, administração e métricas.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/v1/categories:
    get:
      summary: Lista categorias de serviço.
      responses:
        "200":
          description: Categorias retornadas.
    post:
      summary: Cria categoria de serviço administrativa.
      responses:
        "201":
          description: Categoria criada.
  /api/v1/cities:
    get:
      summary: Lista cidades atendidas.
      responses:
        "200":
          description: Cidades retornadas.
    post:
      summary: Cria cidade atendida.
      responses:
        "201":
          description: Cidade criada.
  /api/v1/professionals:
    get:
      summary: Busca profissionais por categoria, cidade e palavra-chave.
      responses:
        "200":
          description: Profissionais retornados e busca registrada para métricas.
    post:
      summary: Cadastra profissional básico.
      responses:
        "201":
          description: Profissional criado.
  /api/v1/professionals/{professionalIdentifier}/profile:
    patch:
      summary: Completa perfil profissional progressivo.
      parameters:
        - $ref: "#/components/parameters/ProfessionalIdentifier"
      responses:
        "200":
          description: Perfil atualizado.
  /api/v1/contact-intentions:
    post:
      summary: Inicia intenção de contato via WhatsApp.
      responses:
        "201":
          description: Intenção registrada.
  /api/v1/post-contact-feedbacks:
    post:
      summary: Registra feedback pós-contato.
      responses:
        "201":
          description: Feedback registrado.
  /api/v1/professional-reviews:
    post:
      summary: Registra avaliação rastreável e anonimizável.
      responses:
        "201":
          description: Avaliação registrada.
  /api/v1/professionals/{professionalIdentifier}/reviews:
    get:
      summary: Lista avaliações públicas de um profissional.
      parameters:
        - $ref: "#/components/parameters/ProfessionalIdentifier"
      responses:
        "200":
          description: Avaliações retornadas.
  /api/v1/review-analysis-requests:
    post:
      summary: Solicita análise de avaliação.
      responses:
        "201":
          description: Solicitação registrada.
  /api/v1/professional-reports:
    post:
      summary: Registra denúncia de profissional.
      responses:
        "201":
          description: Denúncia registrada.
  /api/v1/admin/professionals:
    get:
      summary: Lista profissionais para administração.
      responses:
        "200":
          description: Profissionais administrativos retornados.
  /api/v1/admin/professionals/{professionalIdentifier}/block:
    post:
      summary: Bloqueia profissional.
      parameters:
        - $ref: "#/components/parameters/ProfessionalIdentifier"
      responses:
        "200":
          description: Profissional bloqueado.
  /api/v1/admin/professionals/{professionalIdentifier}/unblock:
    post:
      summary: Desbloqueia profissional.
      parameters:
        - $ref: "#/components/parameters/ProfessionalIdentifier"
      responses:
        "200":
          description: Profissional desbloqueado.
  /api/v1/admin/reports:
    get:
      summary: Lista denúncias para moderação.
      responses:
        "200":
          description: Denúncias retornadas.
  /api/v1/admin/review-analysis-requests:
    get:
      summary: Lista contestações de avaliações.
      responses:
        "200":
          description: Solicitações retornadas.
  /api/v1/admin/metrics:
    get:
      summary: Consulta métricas administrativas básicas.
      responses:
        "200":
          description: Métricas retornadas.
  /api/v1/admin/functional-metrics:
    get:
      summary: Consulta sinais funcionais para ranking futuro.
      responses:
        "200":
          description: Métricas funcionais retornadas.
  /actuator/health/liveness:
    get:
      summary: Healthcheck de liveness.
      responses:
        "200":
          description: API viva.
  /actuator/health/readiness:
    get:
      summary: Healthcheck de readiness.
      responses:
        "200":
          description: API pronta.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProfessionalIdentifier:
      name: professionalIdentifier
      in: path
      required: true
      schema:
        type: string
        format: uuid
