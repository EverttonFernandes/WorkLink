services:
  backend-tests:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace/worklink-api
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    command: mvn verify

  mobile-tests:
    image: ghcr.io/cirruslabs/flutter:3.24.5
    working_dir: /workspace/worklink-mobile
    volumes:
      - .:/workspace
      - flutter-pub-cache:/root/.pub-cache
    command: sh -lc "flutter pub get && flutter test --coverage"

  functional-tests:
    image: alpine:3.20
    working_dir: /workspace
    volumes:
      - .:/workspace
    command:
      - sh
      - -lc
      - "if [ -x functional-tests/run.sh ]; then functional-tests/run.sh; else echo 'N/A: functional-tests/run.sh ainda nao foi criado.'; fi"

volumes:
  maven-cache:
  flutter-pub-cache:
