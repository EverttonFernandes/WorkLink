services:
  worklink-api:
    build:
      context: .
      dockerfile: docker/worklink-api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ${WORKLINK_ENV_FILE:-.env}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${WORKLINK_POSTGRES_DATABASE}
      POSTGRES_USER: ${WORKLINK_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${WORKLINK_POSTGRES_PASSWORD}
    ports:
      - "${WORKLINK_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklink -d worklink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${WORKLINK_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${WORKLINK_MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  database-migrations:
    image: flyway/flyway:10-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./worklink-api/src/main/resources/db/migration:/flyway/sql:ro
    command:
      - -url=jdbc:postgresql://postgres:5432/${WORKLINK_POSTGRES_DATABASE}
      - -user=${WORKLINK_POSTGRES_USERNAME}
      - -password=${WORKLINK_POSTGRES_PASSWORD}
      - -connectRetries=10
      - migrate

  backend-tests:
    image: maven:3.9.9-eclipse-temurin-21
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${WORKLINK_ENV_FILE:-.env}
    working_dir: /workspace/worklink-api
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    command: mvn verify

  mobile-tests:
    image: ghcr.io/cirruslabs/flutter:3.24.5
    working_dir: /workspace/worklink-mobile
    volumes:
      - .:/workspace
      - flutter-pub-cache:/root/.pub-cache
    command: sh -lc "flutter pub get && flutter test --coverage"

  functional-tests:
    image: node:20-alpine
    working_dir: /workspace/functional-tests
    volumes:
      - .:/workspace
      - functional-node-modules:/workspace/functional-tests/node_modules
    command:
      - sh
      - -lc
      - "./run.sh"

volumes:
  postgres-data:
  minio-data:
  maven-cache:
  flutter-pub-cache:
  functional-node-modules:
