services:
  worklink-api:
    build:
      context: .
      dockerfile: docker/worklink-api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ${WORKLINK_ENV_FILE:-.env}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      WORKLINK_TEST_SUPPORT_FIXED_OTP: ${WORKLINK_TEST_SUPPORT_FIXED_OTP:-123456}
      WORKLINK_TEST_SUPPORT_PASSWORD_RECOVERY_TOKEN_EXPOSURE_ENABLED: ${WORKLINK_TEST_SUPPORT_PASSWORD_RECOVERY_TOKEN_EXPOSURE_ENABLED:-false}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 35s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${WORKLINK_POSTGRES_DATABASE}
      POSTGRES_USER: ${WORKLINK_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${WORKLINK_POSTGRES_PASSWORD}
    ports:
      - "${WORKLINK_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklink -d worklink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${WORKLINK_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${WORKLINK_MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  database-migrations:
    image: flyway/flyway:10-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./worklink-api/src/main/resources/db/migration:/flyway/sql:ro
    command:
      - -url=jdbc:postgresql://postgres:5432/${WORKLINK_POSTGRES_DATABASE}
      - -user=${WORKLINK_POSTGRES_USERNAME}
      - -password=${WORKLINK_POSTGRES_PASSWORD}
      - -defaultSchema=worklink
      - -schemas=worklink
      - -connectRetries=10
      - migrate

  backend-tests:
    image: maven:3.9.9-eclipse-temurin-21
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${WORKLINK_ENV_FILE:-.env}
    working_dir: /workspace/worklink-api
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    command: mvn verify

  mobile-tests:
    image: ghcr.io/cirruslabs/flutter:3.44.0
    working_dir: /workspace/worklink-mobile
    volumes:
      - .:/workspace
      - flutter-pub-cache:/root/.pub-cache
    command: sh -lc "flutter pub get && flutter test --coverage"

  mobile-web-preview:
    image: ghcr.io/cirruslabs/flutter:3.44.0
    working_dir: /workspace/worklink-mobile
    environment:
      WORKLINK_MOBILE_WEB_PREVIEW_HOST: 0.0.0.0
      WORKLINK_MOBILE_WEB_PREVIEW_PORT: ${WORKLINK_MOBILE_WEB_PREVIEW_PORT:-18080}
      WORKLINK_MOBILE_WEB_USE_PREVIEW_DATA: ${WORKLINK_MOBILE_WEB_USE_PREVIEW_DATA:-true}
    ports:
      - "${WORKLINK_MOBILE_WEB_PREVIEW_PORT:-18080}:${WORKLINK_MOBILE_WEB_PREVIEW_PORT:-18080}"
    volumes:
      - .:/workspace
      - flutter-pub-cache:/root/.pub-cache
    command:
      - sh
      - -lc
      - /workspace/scripts/run_mobile_web_preview.sh

  android-emulator:
    build:
      context: .
      dockerfile: docker/android-emulator.Dockerfile
    image: worklink-android-emulator
    user: root
    privileged: true
    environment:
      EMULATOR_DEVICE: Nexus 5
      EMULATOR_DATA_PARTITION: 2048m
      EMULATOR_ADDITIONAL_ARGS: -partition-size 2048 -no-metrics
      WEB_VNC: "true"
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "6080:6080"
      - "5554:5554"
      - "5555:5555"
    shm_size: 2gb
    stop_grace_period: 120s
    volumes:
      - .:/workspace:ro
      - android-emulator-data:/home/androidusr/emulator

  functional-tests:
    image: node:20-alpine
    env_file:
      - ${WORKLINK_ENV_FILE:-.env}
    environment:
      WORKLINK_TEST_SUPPORT_FIXED_OTP: ${WORKLINK_TEST_SUPPORT_FIXED_OTP:-123456}
      WORKLINK_TEST_SUPPORT_PASSWORD_RECOVERY_TOKEN_EXPOSURE_ENABLED: "true"
    working_dir: /workspace/functional-tests
    volumes:
      - .:/workspace
      - functional-node-modules:/workspace/functional-tests/node_modules
    command:
      - sh
      - -lc
      - "./run.sh"

volumes:
  postgres-data:
  minio-data:
  maven-cache:
  flutter-pub-cache:
  functional-node-modules:
  android-emulator-data:
